<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>ava2 AppHost — 应用市场 / 画布主页 原型 v2</title>
<style>
:root {
  --ava-bg-base:#fff; --ava-bg-layer-1:#fff; --ava-bg-layer-2:#fff; --ava-bg-sidebar:#f6f7f8;
  --ava-label-primary:#0f1115; --ava-label-secondary:#61666b; --ava-label-tertiary:#81858c;
  --ava-border-l1:rgba(0,0,0,.04); --ava-border-l2:rgba(0,0,0,.1);
  --ava-interactive-bg-hover:rgba(38,49,72,.06); --ava-nav-active:#ebeef2;
  --ava-state-business-primary:#4176e6; --ava-state-danger:#ec1313; --ava-state-success:#12a150;
  --ava-shadow-panel:0 8px 24px rgba(0,0,0,.08); --ava-shadow-elevated:0 2px 10px rgba(0,0,0,.06);
  --ava-space-1:4px; --ava-space-2:8px; --ava-space-3:10px; --ava-space-4:16px; --ava-space-5:24px;
  --ava-radius-sm:10px; --ava-radius-md:12px; --ava-radius-lg:16px; --ava-radius-xl:22px; --ava-radius-pill:999px;
  --ava-font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:root[data-theme="dark"] {
  --ava-bg-base:#151517; --ava-bg-layer-1:#232324; --ava-bg-layer-2:#2c2c2e; --ava-bg-sidebar:#1b1b1c;
  --ava-label-primary:#f9fafb; --ava-label-secondary:#cfd3d6; --ava-label-tertiary:#adb2b8;
  --ava-border-l1:rgba(255,255,255,.06); --ava-border-l2:rgba(255,255,255,.12);
  --ava-interactive-bg-hover:rgba(255,255,255,.08); --ava-nav-active:#43454a;
  --ava-state-business-primary:#679efe; --ava-state-danger:#f25a5a; --ava-state-success:#3ecf8e;
  --ava-shadow-panel:0 8px 28px rgba(0,0,0,.5); --ava-shadow-elevated:0 2px 14px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ava-font-ui);font-size:14px;line-height:24px;color:var(--ava-label-primary);background:var(--ava-bg-base);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* 顶部工具条 */
.proto-bar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:.5px solid var(--ava-border-l2);background:var(--ava-bg-layer-1)}
.proto-bar .brand{font-weight:600}
.proto-bar .dim{color:var(--ava-label-tertiary);font-size:12px}
.proto-bar .spacer{flex:1}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:.5px solid var(--ava-border-l2);border-radius:var(--ava-radius-pill);background:var(--ava-bg-layer-2);color:var(--ava-label-secondary);font-size:13px;transition:.15s}
.pill-btn:hover{background:var(--ava-interactive-bg-hover);color:var(--ava-label-primary)}

.page{max-width:1120px;margin:0 auto;padding:var(--ava-space-5)}

/* ── 应用市场首页 ── */
.store-head{display:flex;align-items:center;gap:12px;margin-bottom:var(--ava-space-5)}
.store-head h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
.search{position:relative;width:280px;margin-left:auto}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ava-label-tertiary)}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border:.5px solid var(--ava-border-l2);border-radius:var(--ava-radius-pill);background:var(--ava-bg-layer-2);color:var(--ava-label-primary);outline:none}
.search input:focus{border-color:var(--ava-state-business-primary)}

.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--ava-space-5) var(--ava-space-4)}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:var(--ava-space-2);padding:var(--ava-space-3);border-radius:var(--ava-radius-lg);transition:.18s;border:1px solid transparent}
.app-tile:hover{background:var(--ava-interactive-bg-hover)}
.app-tile .tile-icon{position:relative;display:grid;place-items:center;width:64px;height:64px;border-radius:var(--ava-radius-xl);background:var(--ava-interactive-bg-hover);box-shadow:var(--ava-shadow-elevated)}
.app-tile .tile-icon svg{width:30px;height:30px}
.app-tile .tile-name{font-size:13px;font-weight:500;line-height:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 禁用：灰度 + 半透明 */
.app-tile.off .tile-icon{filter:grayscale(1);opacity:.55}
.app-tile.off .tile-name{color:var(--ava-label-tertiary)}
/* 运行中角标（绿点） */
.app-tile .dot{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--ava-state-success);border:2px solid var(--ava-bg-layer-1)}
.app-tile.off .dot{background:var(--ava-label-tertiary)}

/* ── 画布主页（桌面启动器） ── */
.launch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--ava-space-5) var(--ava-space-4)}
.launch-tile{display:flex;flex-direction:column;align-items:center;gap:var(--ava-space-2);padding:var(--ava-space-4);border-radius:var(--ava-radius-lg);transition:.18s}
.launch-tile:hover{background:var(--ava-interactive-bg-hover);transform:translateY(-2px)}
.launch-tile .tile-icon{display:grid;place-items:center;width:72px;height:72px;border-radius:var(--ava-radius-xl);background:linear-gradient(135deg,var(--ava-interactive-bg-hover),var(--ava-nav-active));color:var(--ava-state-business-primary);box-shadow:var(--ava-shadow-elevated)}
.launch-tile .tile-icon svg{width:32px;height:32px}
.launch-tile .tile-name{font-size:13px;font-weight:500}

/* ── 详情抽屉 ── */
.drawer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,92vw);background:var(--ava-bg-layer-2);border-radius:var(--ava-radius-xl) var(--ava-radius-xl) 0 0;box-shadow:var(--ava-shadow-panel);transition:transform .25s ease;z-index:50}
.drawer.open{transform:translate(-50%,0)}
.drawer .grip{width:36px;height:4px;border-radius:var(--ava-radius-pill);background:var(--ava-border-l2);margin:10px auto 0}
.drawer .body{padding:var(--ava-space-5)}
.drawer .app-row{display:flex;align-items:center;gap:var(--ava-space-4)}
.drawer .app-row .tile-icon{display:grid;place-items:center;width:56px;height:56px;border-radius:var(--ava-radius-xl);background:var(--ava-interactive-bg-hover)}
.drawer .app-row .tile-icon svg{width:26px;height:26px}
.drawer .app-name{font-size:16px;font-weight:600}
.drawer .app-desc{margin-top:var(--ava-space-2);color:var(--ava-label-secondary);font-size:13px;line-height:20px}
.drawer .divider{height:.5px;background:var(--ava-border-l2);margin:var(--ava-space-4) 0}
.drawer .row{display:flex;align-items:center;padding:6px 0}
.drawer .row .lbl{color:var(--ava-label-secondary);font-size:13px}
.drawer .row .spacer{flex:1}
.switch{position:relative;width:40px;height:24px;border-radius:var(--ava-radius-pill);background:var(--ava-border-l2);transition:.2s}
.switch.on{background:var(--ava-state-success)}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:19px}
.drawer .actions{display:flex;gap:var(--ava-space-3);padding-top:var(--ava-space-3)}
.btn-block{flex:1;height:38px;border-radius:var(--ava-radius-pill);font-size:13px}
.btn-solid{background:var(--ava-state-business-primary);color:#fff}
.btn-solid:hover{filter:brightness(1.08)}
.btn-ghost{border:.5px solid var(--ava-border-l2);color:var(--ava-label-secondary)}
.btn-ghost:hover{background:var(--ava-interactive-bg-hover)}
.btn-danger{border:.5px solid var(--ava-state-danger);color:var(--ava-state-danger)}
.btn-danger:hover{background:rgba(236,19,19,.08)}
.drawer .mask{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:-1}
.drawer .mask.show{opacity:1;pointer-events:auto}

.note{margin-top:var(--ava-space-5);padding:var(--ava-space-4);border:.5px dashed var(--ava-border-l2);border-radius:var(--ava-radius-md);color:var(--ava-label-tertiary);font-size:12px;line-height:20px}
</style>
</head>
<body>

<div class="proto-bar">
  <span class="brand">ava2 AppHost 原型</span>
  <span class="dim">应用市场 / 画布主页 · 产品化呈现 v2</span>
  <span class="spacer"></span>
  <button class="pill-btn" id="btn-theme">切换主题</button>
</div>

<!-- 应用市场首页（App 管理） -->
<section class="page" id="page-store">
  <div class="store-head">
    <h1>我的应用</h1>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 21l-4.3-4.3M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>
      <input id="search" placeholder="搜索应用…">
    </div>
  </div>
  <div class="app-grid" id="app-grid"></div>
</section>

<!-- 画布主页（桌面启动器） -->
<section class="page" id="page-canvas" hidden>
  <div class="store-head">
    <h1>画布</h1>
    <span style="color:var(--ava-label-tertiary);font-size:13px">选择一个应用开始</span>
  </div>
  <div class="launch-grid" id="launch-grid"></div>
</section>

<!-- 详情抽屉 -->
<div class="drawer" id="drawer">
  <div class="mask" id="drawer-mask"></div>
  <div class="grip"></div>
  <div class="body" id="drawer-body"></div>
</div>

<div class="page">
  <div class="note">
    <b>产品化要点：</b>① 去掉 id / 版本号 / 能力标签等技术信息，只呈现图标 + 名称；
    ② 应用市场形态：图标大卡片网格（64px），禁用 App 灰度显示，运行中带绿色状态点；
    ③ 点击 App 弹出底部详情抽屉（底部弹层，同手机交互）：简介 + 启用开关 + 操作按钮；
    ④ 画布主页为桌面启动器：72px 大图标 + hover 抬升；⑤ 全程 design token，亮暗主题可切换。
  </div>
</div>

<script>
const ICONS = {
  chatapp: "M4 5h16v10H9l-5 5V5z",
  fileViewer: "M6 3h8l4 4v14H6z M14 3v4h4",
  fileExplorer: "M3 7.5A1.5 1.5 0 0 1 4.5 6h5l2 2h8A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z",
  sessionboard: "M4 4h16v6H4z M4 14h16v6H4z",
  clock: "M12 8v4l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z",
  allinone: "M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z",
};
const APPS = [
  { id: "chatapp", name: "对话", icon: ICONS.chatapp, on: true, desc: "与智能体多轮对话：写作、编程、工具调用、交付物一键打开。", installable: true },
  { id: "file-viewer", name: "文件预览", icon: ICONS.fileViewer, on: true, desc: "在画布中预览图片、Markdown、网页与 Office 文档。", installable: true },
  { id: "file-explorer", name: "文件浏览", icon: ICONS.fileExplorer, on: true, desc: "浏览工作区文件树，点击即可在画布打开预览。" },
  { id: "sessionboard", name: "会话工作台", icon: ICONS.sessionboard, on: true, desc: "集中管理你的会话：查看、整理与恢复历史记录。" },
  { id: "clock", name: "时钟", icon: ICONS.clock, on: false, desc: "轻量时钟小组件，展示当前时间与日期。" },
  { id: "all-in-one", name: "全组合示例", icon: ICONS.allinone, on: false, desc: "示例应用：展示技能、钩子与 MCP 的组合玩法。" },
  { id: "app-devkit", name: "开发套件", icon: null, on: true, desc: "让智能体按契约帮你编写新 App 的辅助技能。" },
];
const CANVAS = [
  { name: "文件预览", icon: ICONS.fileViewer, desc: "图片 / Markdown / HTML / Office" },
  { name: "会话工作台", icon: ICONS.sessionboard, desc: "会话列表与管理" },
  { name: "契约冒烟", icon: ICONS.allinone, desc: "Hello 示例视图" },
];

const S = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const iconSvg = (d, size) => d
  ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${esc(d)}"/></svg>`
  : `<span style="font-size:${Math.round(size*0.8)}px;opacity:.6">▣</span>`;

function tileHtml(a) {
  return `<button class="app-tile${a.on ? "" : " off"}" onclick="proto.open('${a.id}')" title="${esc(a.name)}">
    <span class="tile-icon">${iconSvg(a.icon, 30)}<span class="dot"></span></span>
    <span class="tile-name">${esc(a.name)}</span>
  </button>`;
}

function render(q) {
  const grid = S("#app-grid");
  const list = q ? APPS.filter((a) => a.name.includes(q)) : APPS;
  grid.innerHTML = list.map(tileHtml).join("");
}

function drawerHtml(a) {
  return `
    <div class="app-row">
      <span class="tile-icon">${iconSvg(a.icon, 26)}</span>
      <div>
        <div class="app-name">${esc(a.name)}</div>
        <div class="app-desc">${esc(a.desc)}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row"><span class="lbl">启用</span><span class="spacer"></span><span class="switch${a.on ? " on" : ""}" onclick="proto.toggle(this)"></span></div>
    <div class="actions">
      <button class="btn-block btn-solid" onclick="proto.toast('打开应用：${esc(a.name)}')">打开</button>
      <button class="btn-block btn-ghost" onclick="proto.close()">完成</button>
      ${a.installable ? `<button class="btn-block btn-danger" onclick="proto.toast('卸载确认')">卸载</button>` : ""}
    </div>`;
}

window.proto = {
  open(id) {
    const a = APPS.find((x) => x.id === id);
    S("#drawer-body").innerHTML = drawerHtml(a);
    S("#drawer").classList.add("open");
    S("#drawer-mask").classList.add("show");
  },
  close() {
    S("#drawer").classList.remove("open");
    S("#drawer-mask").classList.remove("show");
  },
  toggle(sw) {
    const on = sw.classList.toggle("on");
    proto.toast(on ? "已启用" : "已禁用");
  },
  toast(msg) {
    const t = S("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove("show"), 1500);
  },
};

S("#btn-theme").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
});
S("#search").addEventListener("input", (e) => render(e.target.value));
S("#drawer-mask").addEventListener("click", () => proto.close());
S("#drawer .grip").addEventListener("click", () => proto.close());

render("");
S("#launch-grid").innerHTML = CANVAS.map((c) => `
  <button class="launch-tile" onclick="proto.toast('打开画布视图：${esc(c.name)}')">
    <span class="tile-icon">${iconSvg(c.icon, 32)}</span>
    <span class="tile-name">${esc(c.name)}</span>
  </button>`).join("");
</script>
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:.25s;background:var(--ava-bg-layer-2);border:.5px solid var(--ava-border-l2);border-radius:var(--ava-radius-pill);padding:8px 18px;font-size:13px;box-shadow:var(--ava-shadow-panel)"></div>
<style>#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style>
</body>
</html>
